name: Version Bump

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    name: Detect & Tag Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore(release):')"
    steps:
      - name: Load secrets from 1Password
        id: op-secrets
        uses: 1password/load-secrets-action@v3
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          X_REPO_AUTH_APP_ID: op://gh-shared/xauth/app/id
          X_REPO_AUTH_PRIVATE_KEY: op://gh-shared/xauth/app/private-key.pem

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ steps.op-secrets.outputs.X_REPO_AUTH_APP_ID }}
          private-key: ${{ steps.op-secrets.outputs.X_REPO_AUTH_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: Cargo.toml
          args: --version

      - name: Check if bump needed
        id: check
        run: |
          NEXT=$(git cliff --config Cargo.toml --bumped-version 2>/dev/null || echo "")
          CURRENT=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ -z "$NEXT" ] || [ "$NEXT" = "$CURRENT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.check.outputs.skip == 'false'

      - name: Install cargo-edit
        if: steps.check.outputs.skip == 'false'
        run: cargo install cargo-edit --locked

      - name: Bump Cargo.toml version
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.check.outputs.next }}"
          VERSION="${VERSION#v}"
          cargo set-version "$VERSION"

      - name: Generate CHANGELOG.md
        if: steps.check.outputs.skip == 'false'
        uses: orhun/git-cliff-action@v4
        with:
          config: Cargo.toml
          args: --bump
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit and tag
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.check.outputs.next }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): ${VERSION}"
          ANNOTATION=$(git cliff --config Cargo.toml --latest --strip header 2>/dev/null || echo "Release ${VERSION}")
          git tag -a "${VERSION}" -m "${ANNOTATION}"
          git push --follow-tags
