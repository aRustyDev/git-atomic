[package]
name = "git-atomic"
version = "0.1.0"
edition = "2024"

[package.metadata.git-cliff.bump]
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "0.1.0"

[package.metadata.git-cliff.changelog]
header = "# Changelog\n\nAll notable changes to this project will be documented in this file.\n"
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.github.pr_number %} \
                ([#{{ commit.github.pr_number }}](https://github.com/aRustyDev/git-atomic/pull/{{ commit.github.pr_number }}))\
            {% endif %}\
    {% endfor %}
{% endfor %}
"""
trim = true
footer = "<!-- generated by git-cliff -->"

[package.metadata.git-cliff.git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
commit_parsers = [
    # Skip merge commits and dependabot
    { message = "^Merge", skip = true },
    { body = ".*Signed-off-by: dependabot", skip = true },

    # Conventional commit types
    { message = "^feat", group = "<!-- 0 -->✨ Features" },
    { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^docs", group = "<!-- 2 -->📝 Documentation" },
    { message = "^perf", group = "<!-- 3 -->⚡ Performance" },
    { message = "^refactor", group = "<!-- 4 -->♻️ Refactor" },
    { message = "^style", group = "<!-- 5 -->🎨 Styling" },
    { message = "^test", group = "<!-- 6 -->✅ Testing" },
    { message = "^ci", group = "<!-- 7 -->👷 CI/CD" },
    { message = "^chore", group = "<!-- 8 -->🔧 Miscellaneous" },
    { message = "^build", group = "<!-- 9 -->📦 Build" },
    { message = "^revert", group = "<!-- 10 -->⏪ Reverts" },

    # Gitmoji-only commits (no conventional prefix)
    { message = "^✨", group = "<!-- 0 -->✨ Features" },
    { message = "^🐛", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^🚑", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^🩹", group = "<!-- 1 -->🐛 Bug Fixes" },
    { message = "^📝", group = "<!-- 2 -->📝 Documentation" },
    { message = "^⚡", group = "<!-- 3 -->⚡ Performance" },
    { message = "^♻️", group = "<!-- 4 -->♻️ Refactor" },
    { message = "^🎨", group = "<!-- 5 -->🎨 Styling" },
    { message = "^💄", group = "<!-- 5 -->🎨 Styling" },
    { message = "^✅", group = "<!-- 6 -->✅ Testing" },
    { message = "^🧪", group = "<!-- 6 -->✅ Testing" },
    { message = "^👷", group = "<!-- 7 -->👷 CI/CD" },
    { message = "^💚", group = "<!-- 7 -->👷 CI/CD" },
    { message = "^🔧", group = "<!-- 8 -->🔧 Miscellaneous" },
    { message = "^🔨", group = "<!-- 8 -->🔧 Miscellaneous" },
    { message = "^📦", group = "<!-- 9 -->📦 Build" },
    { message = "^⏪", group = "<!-- 10 -->⏪ Reverts" },
    { message = "^🔒", group = "<!-- 11 -->🔒 Security" },
    { message = "^⬆️", group = "<!-- 12 -->⬆️ Dependencies" },
    { message = "^⬇️", group = "<!-- 12 -->⬆️ Dependencies" },
    { message = "^➕", group = "<!-- 12 -->⬆️ Dependencies" },
    { message = "^➖", group = "<!-- 12 -->⬆️ Dependencies" },
    { message = "^📌", group = "<!-- 12 -->⬆️ Dependencies" },
    { message = "^🔥", group = "<!-- 13 -->🔥 Removed" },
    { message = "^⚰️", group = "<!-- 13 -->🔥 Removed" },
    { message = "^💥", group = "<!-- 14 -->💥 Breaking Changes" },
    { message = "^🏗️", group = "<!-- 14 -->💥 Breaking Changes" },
    { message = "^🚀", group = "<!-- 15 -->🚀 Deployment" },
    { message = "^🔖", group = "<!-- 15 -->🚀 Deployment" },
]
protect_breaking_commits = false
filter_commits = false
fail_on_unmatched_commit = false
tag_pattern = "v[0-9].*"
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
link_parsers = [
    { pattern = "#(\\d+)", href = "https://github.com/aRustyDev/git-atomic/issues/$1" },
    { pattern = "RFC(\\d+)", text = "ietf-rfc$1", href = "https://datatracker.ietf.org/doc/html/rfc$1" },
]
recurse_submodules = false

[package.metadata.git-cliff.remote.github]
owner = "aRustyDev"
repo = "git-atomic"

[dependencies]
clap = { version = "4.5.55", features = ["derive"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
gix = { version = "0.78.0", features = ["tree-editor", "revision"] }
globset = "0.4"
indexmap = { version = "2", features = ["serde"] }
schemars = { version = "1.2.0", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
owo-colors = "4"
toml = "0.8"
tracing = "0.1"

[dev-dependencies]
glob = "0.3"
jsonschema = "0.29"
tempfile = "3"
